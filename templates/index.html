<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fanta Photobooth v22</title>
    <style>
        @font-face {
            font-family: "FantaSans";
            src: url("{{ url_for('static', filename='fonts/FantaSans-Regular.otf') }}") format("opentype");
            font-weight: 400;
        }
        @font-face {
            font-family: "FantaSans";
            src: url("{{ url_for('static', filename='fonts/FantaSans-Bold.otf') }}") format("opentype");
            font-weight: 700;
        }
        @font-face {
            font-family: "FantaSans";
            src: url("{{ url_for('static', filename='fonts/FantaSans-UltraBold.otf') }}") format("opentype");
            font-weight: 800;
        }
        @font-face {
            font-family: "FantaPop";
            src: url("{{ url_for('static', filename='fonts/FantaPop-Condensed.otf') }}") format("opentype");
            font-weight: 700;
        }
        :root {
            --fanta-orange: #ff6a00;
            --fanta-blue: #1c4cff;
            --ink: #111;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: "FantaSans", sans-serif;
            background: #000;
            color: #fff;
        }
        .screen {
            position: relative;
            min-height: 100dvh;
            max-height: 100dvh;
            display: none;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .screen.is-on { display: flex; }
        #result.is-on {
            justify-content: flex-start;
        }

        .top-logo {
            position: relative;
            z-index: 3;
            width: min(42vw, 220px);
            margin-top: 1.2vh;
        }
        .top-logo img { width: 100%; display: block; }

        #capture .top-logo,
        #result .top-logo {
            width: 190px;
            margin-top: 0.6vh;
        }

        .polaroid-stage {
            position: relative;
            z-index: 2;
            width: min(82vw, 440px);
            margin-top: 0.6vh;
        }
        .polaroid {
            position: relative;
            background: #fff;
            background-image: linear-gradient(180deg, #fff 0%, #f3efe8 100%);
            padding: 14px 14px 0;
            box-shadow:
                0 2px 0 rgba(255,255,255,.7) inset,
                0 22px 40px rgba(0,0,0,.5);
            border: 1px solid #ece8e1;
        }
        .viewfinder {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            background: #111;
            overflow: hidden;
            isolation: isolate;
        }
        .viewfinder > img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        #cam {
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #preview.is-on { display: block; }
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .has-feed .loader { display: none; }
        .spinner {
            width: 46px;
            height: 46px;
            border: 4px solid rgba(255,255,255,.2);
            border-top-color: var(--fanta-orange);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .countdown {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }
        .countdown.is-on { display: flex; }
        .countdown span {
            width: 28%;
            aspect-ratio: 1;
            min-width: 72px;
            background: var(--fanta-orange);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "FantaPop", "FantaSans", sans-serif;
            font-size: clamp(2.4rem, 10vw, 4.2rem);
            font-weight: 700;
        }

        .logo-on-polaroid {
            position: absolute;
            left: 50%;
            bottom: 0.2rem;
            transform: translateX(-50%);
            width: 62%;
            z-index: 6;
            pointer-events: none;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,.35));
            display: none;
        }
        .polaroid-stage.has-shot .logo-on-polaroid {
            display: block;
        }
        .polaroid-stage.has-shot .btn-shot {
            display: none;
        }
        .polaroid-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 5.6rem;
            padding: 0.35rem 0.6rem;
        }
        .btn-shot {
            position: relative;
            z-index: 7;
            border: 0;
            cursor: pointer;
            background: linear-gradient(#ff8a14, #ff5a00);
            color: #111;
            font-family: "FantaPop", "FantaSans", sans-serif;
            font-size: clamp(1rem, 4.2vw, 1.45rem);
            letter-spacing: .02em;
            padding: .7rem 1.8rem;
            border-radius: 999px;
            min-width: 68%;
            box-shadow: 0 8px 0 #c43e00;
        }
        .btn-shot:disabled { opacity: .55; cursor: default; }

        .drip-wrap {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .drip-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 34%;
            background: url("{{ url_for('static', filename='img/bg_orange.png') }}") center / cover no-repeat;
        }
        .drip-bottom svg {
            position: absolute;
            left: 0;
            right: 0;
            top: -48px;
            width: 100%;
            height: 56px;
        }

        .how {
            position: relative;
            z-index: 3;
            margin-top: auto;
            margin-bottom: 2.4vh;
            width: min(92vw, 520px);
            background: var(--fanta-blue);
            border-radius: 18px;
            display: grid;
            grid-template-columns: 0.9fr 1.4fr;
            gap: .6rem;
            padding: .85rem 1rem;
            align-items: center;
        }
        .how h2 {
            margin: 0;
            font-family: "FantaPop", "FantaSans", sans-serif;
            font-size: clamp(1.05rem, 4.4vw, 1.55rem);
            line-height: .95;
        }
        .how ol {
            margin: 0;
            padding-left: 1.15rem;
            font-size: clamp(.62rem, 2.6vw, .82rem);
            font-weight: 700;
            letter-spacing: .01em;
        }
        .how li { margin: .12rem 0; }

        #ready {
            background: #000;
            text-align: center;
            padding: 0 1.2rem 2rem;
        }
        #ready .headline {
            margin: 1.4rem 0 .5rem;
            color: var(--fanta-orange);
            font-family: "FantaPop", "FantaSans", sans-serif;
            font-size: clamp(1.6rem, 7vw, 2.5rem);
            line-height: .95;
            max-width: 14ch;
        }
        #ready .lead {
            margin: 0 auto 1.2rem;
            max-width: 22ch;
            font-size: clamp(.72rem, 3.2vw, .95rem);
            font-weight: 700;
            letter-spacing: .04em;
        }
        #qrBox {
            position: relative;
            width: min(52vw, 240px);
            aspect-ratio: 1;
            background: #fff;
            padding: 10px;
            margin: 0 auto 1.4rem;
            z-index: 3;
        }
        #qrBox img {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: contain;
        }
        #qrBox img.is-on { display: block; }
        .qr-wait {
            position: absolute;
            inset: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }
        #qrBox.has-qr .qr-wait { display: none; }
        .qr-spin {
            width: 48px;
            height: 48px;
            border: 5px solid #ffd3b0;
            border-top-color: var(--fanta-orange);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        .btn-again {
            border: 0;
            cursor: pointer;
            background: #fff;
            color: #111;
            font-family: "FantaPop", "FantaSans", sans-serif;
            font-size: clamp(1.05rem, 4.4vw, 1.5rem);
            padding: .75rem 2.4rem;
            border-radius: 999px;
            position: relative;
            z-index: 3;
        }
        .ready-drip {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 22%;
            background: url("{{ url_for('static', filename='img/bg_orange.png') }}") center / cover no-repeat;
            z-index: 1;
        }
        .ready-drip svg {
            position: absolute;
            top: -40px;
            width: 100%;
            height: 48px;
        }
        #result .polaroid-stage {
            width: min(72vw, 380px);
            flex: 0 1 auto;
        }
        #result .logo-in-footer {
            width: 58%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            transform: translateY(3rem);
            margin: -2rem auto -3rem;
        }
        .btn-share {
            position: relative;
            z-index: 8;
            border: 0;
            cursor: pointer;
            background: linear-gradient(#ff8a14, #ff5a00);
            color: #111;
            font-family: "FantaPop", "FantaSans", sans-serif;
            font-size: clamp(1rem, 4.2vw, 1.45rem);
            letter-spacing: .02em;
            padding: .7rem 1.8rem;
            border-radius: 999px;
            min-width: min(68%, 280px);
            box-shadow: 0 8px 0 #c43e00;
            margin-top: 5.1rem;
        }
        .btn-share:disabled {
            pointer-events: none;
        }
        #shotImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
    </style>
</head>
<body>
    <section class="screen is-on" id="capture">
        <div class="drip-wrap">
            <div class="drip-bottom">
                <svg viewBox="0 0 400 56" preserveAspectRatio="none" aria-hidden="true">
                    <path fill="#000" d="M0 0h400v20C360 20 350 56 330 56c-28 0-32-36-58-36S240 56 214 56s-30-36-58-36-34 36-62 36S54 20 0 20V0z"/>
                </svg>
            </div>
        </div>
        <div class="top-logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Fanta"></div>
        <div class="polaroid-stage">
            <div class="polaroid">
                <div class="viewfinder" id="previewBox">
                    <video id="cam" playsinline autoplay muted></video>
                    <img id="preview" alt="" hidden>
                    <div class="loader" aria-hidden="true"><div class="spinner"></div></div>
                    <div class="countdown" id="count"><span>3</span></div>
                </div>
                <div class="polaroid-footer">
                    <button class="btn-shot" id="snap" type="button">TIRAR FOTO</button>
                </div>
            </div>
            <img class="logo-on-polaroid" src="{{ url_for('static', filename='img/logo.png') }}" alt="">
        </div>
        <div class="how">
            <h2>COMO FUNCIONA?</h2>
            <ol>
                <li>POSICIONE-SE NO CENTRO DA TELA</li>
                <li>TOQUE EM TIRAR FOTO</li>
                <li>SORRIA E PREPARE-SE</li>
            </ol>
        </div>
    </section>

    <section class="screen" id="result">
        <div class="drip-wrap">
            <div class="drip-bottom">
                <svg viewBox="0 0 400 56" preserveAspectRatio="none" aria-hidden="true">
                    <path fill="#000" d="M0 0h400v20C360 20 350 56 330 56c-28 0-32-36-58-36S240 56 214 56s-30-36-58-36-34 36-62 36S54 20 0 20V0z"/>
                </svg>
            </div>
        </div>
        <div class="top-logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Fanta"></div>
        <div class="polaroid-stage">
            <div class="polaroid">
                <div class="viewfinder">
                    <img id="shotImg" alt="Sua foto">
                </div>
                <div class="polaroid-footer">
                    <img class="logo-in-footer" src="{{ url_for('static', filename='img/logo.png') }}" alt="Fanta">
                </div>
            </div>
        </div>
        <button class="btn-share" id="share" type="button" disabled>COMPARTILHAR</button>
    </section>

    <section class="screen" id="ready">
        <div class="ready-drip">
            <svg viewBox="0 0 400 48" preserveAspectRatio="none" aria-hidden="true">
                <path fill="#000" d="M0 0h400v18C355 18 348 48 322 48c-30 0-34-30-62-30S228 48 198 48s-32-30-64-30-36 30-66 30S42 18 0 18V0z"/>
            </svg>
        </div>
        <div class="top-logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Fanta"></div>
        <h1 class="headline">SUA FOTO ESTÁ PRONTA!</h1>
        <p class="lead">ESCANEIE O QR CODE PARA ACESSAR E COMPARTILHAR SUA FOTO.</p>
        <div id="qrBox">
            <div class="qr-wait" aria-hidden="true"><div class="qr-spin"></div></div>
            <img id="qrImg" alt="QR Code da foto">
        </div>
        <button class="btn-again" id="again" type="button">RECOMEÇAR</button>
    </section>

    <div class="hidden-controls">
        <select id="bg">
            {% for name in backgrounds %}
            <option value="{{ name }}" {% if name == current_bg %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
        </select>
        <select id="fr">
            <option value="" {% if not current_frame %}selected{% endif %}></option>
            {% for name in frames %}
            <option value="{{ name }}" {% if name == current_frame %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
        </select>
    </div>

    <script>
        const captureScreen = document.getElementById("capture");
        const resultScreen = document.getElementById("result");
        const readyScreen = document.getElementById("ready");
        const snap = document.getElementById("snap");
        const countEl = document.getElementById("count");
        const countNum = countEl.querySelector("span");
        const shareBtn = document.getElementById("share");
        let pendingShareUrl = "";
        let frozenShotUrl = null;
        let holdLive = false;

        function showScreen(el) {
            captureScreen.classList.remove("is-on");
            resultScreen.classList.remove("is-on");
            readyScreen.classList.remove("is-on");
            el.classList.add("is-on");
            holdLive = el !== captureScreen;
        }

        const qrBox = document.getElementById("qrBox");
        const qrImg = document.getElementById("qrImg");

        function qrUrlFor(shareUrl) {
            return "https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=8&data=" +
                encodeURIComponent(shareUrl);
        }

        function markQrReady() {
            qrImg.classList.add("is-on");
            qrBox.classList.add("has-qr");
        }

        qrImg.addEventListener("load", markQrReady);
        qrImg.addEventListener("error", markQrReady);

        function startQr(shareUrl) {
            qrImg.classList.remove("is-on");
            qrBox.classList.remove("has-qr");
            qrImg.src = qrUrlFor(shareUrl);
            if (qrImg.complete && qrImg.naturalWidth) markQrReady();
        }

        function showReady(shareUrl) {
            if (!shareUrl) return;
            if (!qrImg.src) startQr(shareUrl);
            showScreen(readyScreen);
        }

        shareBtn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            if (shareBtn.disabled) return;
            if (!pendingShareUrl) return;
            showReady(pendingShareUrl);
        });

        document.getElementById("again").addEventListener("click", () => {
            pendingShareUrl = "";
            frozenShotUrl = null;
            qrImg.removeAttribute("src");
            qrImg.classList.remove("is-on");
            qrBox.classList.remove("has-qr");
            snap.disabled = false;
            showScreen(captureScreen);
        });

        async function takePhoto() {
            const live = document.getElementById("preview");
            if (live && live.src) {
                frozenShotUrl = live.src;
                lastBlobUrl = null;
                document.getElementById("shotImg").src = frozenShotUrl;
            }
            shareBtn.disabled = true;
            showScreen(resultScreen);
            const res = await fetch("/capture", { method: "POST", credentials: "same-origin" });
            const data = await res.json();
            if (!data.ok) {
                alert(data.error || "Falha ao capturar");
                snap.disabled = false;
                showScreen(captureScreen);
                return;
            }
            pendingShareUrl = data.share_url || (location.origin + data.url);
            startQr(pendingShareUrl);
            setTimeout(() => { shareBtn.disabled = false; }, 700);
        }

        snap.addEventListener("click", async (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            if (snap.disabled) return;
            snap.disabled = true;
            countEl.classList.add("is-on");
            for (let n = 3; n >= 1; n--) {
                countNum.textContent = String(n);
                await new Promise((r) => setTimeout(r, 900));
            }
            countEl.classList.remove("is-on");
            await takePhoto();
        });

        const cam = document.getElementById("cam");
        const preview = document.getElementById("preview");
        const previewBox = document.getElementById("previewBox");
        const sendCanvas = document.createElement("canvas");
        const MAX_W = 960;
        const MAX_H = 540;
        const sendCtx = sendCanvas.getContext("2d", { alpha: false });
        sendCanvas.width = MAX_W;
        sendCanvas.height = MAX_H;
        sendCtx.imageSmoothingEnabled = true;
        sendCtx.imageSmoothingQuality = "high";
        let lastBlobUrl = null;

        function drawMirrored() {
            const vw = cam.videoWidth || MAX_W;
            const vh = cam.videoHeight || MAX_H;
            const scale = Math.min(MAX_W / vw, MAX_H / vh);
            const dw = Math.round(vw * scale);
            const dh = Math.round(vh * scale);
            const x = Math.floor((MAX_W - dw) / 2);
            const y = Math.floor((MAX_H - dh) / 2);
            sendCtx.fillStyle = "#000";
            sendCtx.fillRect(0, 0, MAX_W, MAX_H);
            sendCtx.save();
            sendCtx.setTransform(-1, 0, 0, 1, MAX_W, 0);
            sendCtx.drawImage(cam, MAX_W - x - dw, y, dw, dh);
            sendCtx.restore();
        }

        async function startClientCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: "user",
                    width: { ideal: 960 },
                    height: { ideal: 540 },
                    frameRate: { ideal: 12 }
                }
            });
            cam.srcObject = stream;
            await cam.play();
            let inFlight = false;
            async function pushFrame() {
                if (holdLive || document.hidden || inFlight || cam.readyState < 2) {
                    setTimeout(pushFrame, 180);
                    return;
                }
                inFlight = true;
                try {
                    drawMirrored();
                    const blob = await new Promise((r) => sendCanvas.toBlob(r, "image/jpeg", 0.65));
                    if (blob) {
                        const res = await fetch("/frame", {
                            method: "POST",
                            body: blob,
                            credentials: "same-origin"
                        });
                        if (res.ok && res.headers.get("content-type") && res.headers.get("content-type").includes("image/jpeg")) {
                            const out = await res.blob();
                            const url = URL.createObjectURL(out);
                            preview.src = url;
                            preview.hidden = false;
                            preview.classList.add("is-on");
                            previewBox.classList.add("has-feed");
                            if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
                            lastBlobUrl = url;
                        }
                    }
                } finally {
                    inFlight = false;
                    setTimeout(pushFrame, 120);
                }
            }
            pushFrame();
        }
        startClientCamera().catch((err) => {
            alert("Permita a câmera neste aparelho: " + (err.message || err));
        });
    </script>
</body>
</html>
