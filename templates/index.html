<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #120c18;
            --card: #1e1528;
            --accent: #e8b86d;
            --text: #f4eef8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: radial-gradient(circle at top, #3a2048, var(--bg));
            color: var(--text);
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            letter-spacing: 0.12em;
            font-weight: 400;
            margin: 1.2rem 0 0.3rem;
        }
        p.sub {
            text-align: center;
            opacity: 0.75;
            margin: 0 0 1rem;
            font-family: system-ui, sans-serif;
            font-size: 0.95rem;
        }
        .stage {
            display: flex;
            justify-content: center;
            padding: 0 1rem;
        }
        .preview {
            width: min(1280px, 92vw);
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
            position: relative;
        }
        #cam {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 1280px;
            height: 720px;
            opacity: 0;
            pointer-events: none;
        }
        .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .preview img.is-on {
            display: block;
        }
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .preview.has-feed .loader {
            display: none;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(244, 238, 248, 0.18);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .controls {
            max-width: 1100px;
            margin: 1.2rem auto 2rem;
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr 1fr auto;
            padding: 0 1rem;
            font-family: system-ui, sans-serif;
        }
        label { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.35rem; }
        select, button {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            border: 1px solid #5a4068;
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
        }
        button {
            background: var(--accent);
            color: #2a1608;
            border: none;
            font-weight: 700;
            cursor: pointer;
            align-self: end;
            min-width: 180px;
        }
        button:active { transform: scale(0.98); }
        .shot {
            text-align: center;
            font-family: system-ui, sans-serif;
        }
        .shot img {
            max-width: 320px;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
        @media (max-width: 800px) {
            .controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>PHOTOBOOTH</h1>
    <p class="sub">A câmera é a deste aparelho · cenário atrás · moldura na frente</p>
    <div class="stage">
        <div class="preview" id="previewBox">
            <video id="cam" playsinline autoplay muted></video>
            <img id="preview" alt="" hidden>
            <div class="loader" aria-hidden="true"><div class="spinner"></div></div>
        </div>
    </div>
    <div class="controls">
        <div>
            <label for="bg">Cenário (atrás)</label>
            <select id="bg">
                {% for name in backgrounds %}
                <option value="{{ name }}" {% if name == current_bg %}selected{% endif %}>{{ background_labels.get(name, name.replace('.png','')) }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="fr">Moldura (frente)</label>
            <select id="fr">
                {% for name in frames %}
                <option value="{{ name }}" {% if name == current_frame %}selected{% endif %}>{{ frame_labels.get(name, name.replace('.png','')) }}</option>
                {% endfor %}
            </select>
        </div>
        <button id="snap" type="button">Tirar foto</button>
    </div>
    <div class="shot" id="last"></div>
    <script>
        async function sendConfig() {
            await fetch("/config", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    background: document.getElementById("bg").value,
                    frame: document.getElementById("fr").value
                })
            });
        }
        document.getElementById("bg").addEventListener("change", sendConfig);
        document.getElementById("fr").addEventListener("change", sendConfig);
        document.getElementById("snap").addEventListener("click", async () => {
            const res = await fetch("/capture", { method: "POST", credentials: "same-origin" });
            const data = await res.json();
            if (!data.ok) {
                alert(data.error || "Falha ao capturar");
                return;
            }
            document.getElementById("last").innerHTML =
                "<p>Foto salva em photos/" + data.file + "</p><img src='" + data.url + "' alt='Última foto'>";
        });

        const cam = document.getElementById("cam");
        const preview = document.getElementById("preview");
        const previewBox = document.getElementById("previewBox");
        const sendCanvas = document.createElement("canvas");
        const MAX_W = 1280;
        const MAX_H = 720;
        const sendCtx = sendCanvas.getContext("2d", { alpha: false });
        sendCtx.imageSmoothingEnabled = true;
        sendCtx.imageSmoothingQuality = "high";
        sendCanvas.width = MAX_W;
        sendCanvas.height = MAX_H;
        sendCtx.imageSmoothingEnabled = true;
        sendCtx.imageSmoothingQuality = "high";
        let lastBlobUrl = null;

        function drawMirrored() {
            const vw = cam.videoWidth || MAX_W;
            const vh = cam.videoHeight || MAX_H;
            const scale = Math.min(MAX_W / vw, MAX_H / vh);
            const dw = Math.round(vw * scale);
            const dh = Math.round(vh * scale);
            const x = Math.floor((MAX_W - dw) / 2);
            const y = Math.floor((MAX_H - dh) / 2);
            sendCtx.fillStyle = "#000";
            sendCtx.fillRect(0, 0, MAX_W, MAX_H);
            sendCtx.save();
            sendCtx.setTransform(-1, 0, 0, 1, MAX_W, 0);
            sendCtx.drawImage(cam, MAX_W - x - dw, y, dw, dh);
            sendCtx.restore();
        }

        async function startClientCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: "user",
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    frameRate: { ideal: 24 }
                }
            });
            cam.srcObject = stream;
            await cam.play();
            let inFlight = false;
            async function pushFrame() {
                if (inFlight || cam.readyState < 2) {
                    requestAnimationFrame(pushFrame);
                    return;
                }
                inFlight = true;
                try {
                    drawMirrored();
                    const blob = await new Promise((r) => sendCanvas.toBlob(r, "image/jpeg", 0.72));
                    if (blob) {
                        const res = await fetch("/frame", {
                            method: "POST",
                            body: blob,
                            credentials: "same-origin"
                        });
                        if (res.ok && res.headers.get("content-type") && res.headers.get("content-type").includes("image/jpeg")) {
                            const out = await res.blob();
                            const url = URL.createObjectURL(out);
                            preview.src = url;
                            preview.hidden = false;
                            preview.classList.add("is-on");
                            previewBox.classList.add("has-feed");
                            if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
                            lastBlobUrl = url;
                        }
                    }
                } finally {
                    inFlight = false;
                    requestAnimationFrame(pushFrame);
                }
            }
            pushFrame();
        }
        startClientCamera().catch((err) => {
            alert("Permita a câmera neste aparelho: " + (err.message || err));
        });
    </script>
</body>
</html>
