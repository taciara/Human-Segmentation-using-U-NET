<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fanta Photobooth V2 (Simples)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen.active {
            display: flex;
        }
        #startScreen {
            background: linear-gradient(135deg, #ff6a00 0%, #ff5a00 100%);
            gap: 2rem;
        }
        #cameraScreen {
            background: #000;
            position: relative;
        }
        #video {
            display: none;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .camera-controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 10;
        }
        .camera-controls button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.5rem;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .camera-controls button:hover {
            transform: scale(1.05);
        }
        .status {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(0,0,0,0.7);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        #resultScreen {
            background: #000;
            gap: 2rem;
        }
        .result-image {
            max-width: 80vw;
            max-height: 50vh;
            border: 5px solid #ff6a00;
            border-radius: 10px;
        }
        .result-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .logo {
            font-size: 3rem;
        }
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .countdown {
            font-size: 5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA INICIAL -->
        <div id="startScreen" class="screen active">
            <div class="logo">🎃</div>
            <div class="title">Photobooth Halloween</div>
            <button onclick="startCamera()">COMEÇAR</button>
        </div>

        <!-- TELA CÂMERA -->
        <div id="cameraScreen" class="screen">
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas"></canvas>
            <div class="status" id="status">Pronto!</div>
            <div class="camera-controls">
                <button id="captureBtn" onclick="capturePhoto()">📸</button>
                <button onclick="goToStart()">✕</button>
            </div>
        </div>

        <!-- TELA CONTAGEM -->
        <div id="countdownScreen" class="screen">
            <div class="countdown" id="countdownNumber">3</div>
        </div>

        <!-- TELA RESULTADO -->
        <div id="resultScreen" class="screen">
            <h1>SUA FOTO</h1>
            <canvas id="resultCanvas" class="result-image"></canvas>
            <div class="result-buttons">
                <button onclick="goToStart()">REFAZER</button>
                <button onclick="sharePhoto()">COMPARTILHAR</button>
            </div>
        </div>
    </div>

    <script>
        let state = {
            video: null,
            canvas: null,
            ctx: null,
            backgroundImage: null,
            capturedPhoto: null,
            isProcessing: false
        };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function startCamera() {
            showScreen('cameraScreen');

            try {
                state.video = document.getElementById('video');
                state.canvas = document.getElementById('canvas');
                state.ctx = state.canvas.getContext('2d');

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: 'user'
                    },
                    audio: false
                });

                state.video.srcObject = stream;
                await new Promise(resolve => {
                    state.video.onloadedmetadata = resolve;
                });

                state.canvas.width = state.video.videoWidth;
                state.canvas.height = state.video.videoHeight;

                processFrame();
                document.getElementById('captureBtn').disabled = false;
            } catch (err) {
                alert('Erro: ' + err.message);
                goToStart();
            }
        }

        function processFrame() {
            const ctx = state.ctx;
            const video = state.video;
            const canvas = state.canvas;

            // Desenhar gradiente Fanta como fundo
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#ff6a00');
            gradient.addColorStop(1, '#ff5a00');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar vídeo (câmera) por cima
            ctx.globalAlpha = 0.8;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(processFrame);
        }

        async function capturePhoto() {
            if (state.isProcessing) return;
            state.isProcessing = true;

            // Contagem
            for (let i = 3; i > 0; i--) {
                showScreen('countdownScreen');
                document.getElementById('countdownNumber').textContent = i;
                await new Promise(r => setTimeout(r, 1000));
            }

            // Capturar
            showScreen('cameraScreen');
            await new Promise(r => setTimeout(r, 500));

            state.capturedPhoto = state.canvas.toDataURL('image/jpeg', 0.95);

            // Mostrar resultado
            const resultCanvas = document.getElementById('resultCanvas');
            const img = new Image();
            img.onload = () => {
                resultCanvas.width = img.width;
                resultCanvas.height = img.height;
                resultCanvas.getContext('2d').drawImage(img, 0, 0);
                showScreen('resultScreen');
            };
            img.src = state.capturedPhoto;

            state.isProcessing = false;
        }

        async function sharePhoto() {
            if (!state.capturedPhoto) return;

            try {
                const blob = await (await fetch(state.capturedPhoto)).blob();
                const formData = new FormData();
                formData.append('foto', blob, 'photo.jpg');

                // EDITE AQUI COM SUA URL
                const response = await fetch('https://SEU-DOMINIO/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success && data.url) {
                    if (navigator.share) {
                        await navigator.share({
                            title: 'Minha foto',
                            text: 'Veja minha foto!',
                            url: data.url
                        });
                    } else {
                        alert('Link: ' + data.url);
                    }
                } else {
                    alert('Erro ao compartilhar');
                }
            } catch (err) {
                alert('Erro: ' + err.message);
            }
        }

        function goToStart() {
            if (state.video && state.video.srcObject) {
                state.video.srcObject.getTracks().forEach(t => t.stop());
            }
            showScreen('startScreen');
        }
    </script>
</body>
</html>
