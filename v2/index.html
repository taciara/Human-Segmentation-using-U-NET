<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fanta Halloween Photobooth V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active {
            display: flex;
        }

        /* TELA INICIAL */
        #startScreen {
            background: linear-gradient(135deg, #ff6a00 0%, #ff5a00 100%);
            gap: 2rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        /* TELA CÂMERA */
        #cameraScreen {
            background: #000;
            position: relative;
        }

        #video {
            display: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .camera-controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 10;
        }

        .camera-controls button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.5rem;
        }

        .status {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(0,0,0,0.7);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        /* TELA CONTAGEM */
        #countdownScreen {
            background: #000;
            font-size: 5rem;
            font-weight: bold;
        }

        /* TELA RESULTADO */
        #resultScreen {
            background: #000;
            gap: 2rem;
        }

        .result-container {
            text-align: center;
        }

        .result-image {
            max-width: 80vw;
            max-height: 50vh;
            border: 5px solid #ff6a00;
            border-radius: 10px;
        }

        .result-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-buttons button {
            padding: 0.8rem 1.5rem;
        }

        .loading {
            display: none;
            text-align: center;
            gap: 1rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ff6a00;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.2);
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA INICIAL -->
        <div id="startScreen" class="screen active">
            <div class="logo">🎃 FANTA</div>
            <div class="title">Photobooth Halloween</div>
            <button onclick="startCamera()">COMEÇAR</button>
        </div>

        <!-- TELA CÂMERA -->
        <div id="cameraScreen" class="screen">
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas"></canvas>
            <div class="status" id="status">Preparando...</div>
            <div class="camera-controls">
                <button id="captureBtn" onclick="capturePhoto()">📸</button>
                <button onclick="goToStart()">✕</button>
            </div>
        </div>

        <!-- TELA CONTAGEM -->
        <div id="countdownScreen" class="screen">
            <div id="countdownNumber">3</div>
        </div>

        <!-- TELA RESULTADO -->
        <div id="resultScreen" class="screen">
            <div class="result-container">
                <h1>SUA FOTO</h1>
                <canvas id="resultCanvas" class="result-image"></canvas>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Compartilhando...</div>
            </div>
            <div class="result-buttons">
                <button onclick="goToStart()">REFAZER</button>
                <button onclick="sharePhoto()">COMPARTILHAR</button>
            </div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <script>
        // Estado global
        let state = {
            video: null,
            canvas: null,
            ctx: null,
            segmenter: null,
            backgroundImage: null,
            capturedPhoto: null,
            isProcessing: false
        };

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function startCamera() {
            showScreen('cameraScreen');

            try {
                state.video = document.getElementById('video');
                state.canvas = document.getElementById('canvas');
                state.ctx = state.canvas.getContext('2d');

                // Inicializar câmera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: 'user'
                    },
                    audio: false
                });

                state.video.srcObject = stream;
                await new Promise(resolve => {
                    state.video.onloadedmetadata = resolve;
                });

                // Configurar canvas
                state.canvas.width = state.video.videoWidth;
                state.canvas.height = state.video.videoHeight;

                // Carregar imagem de fundo
                await loadBackgroundImage();

                // Inicializar MediaPipe
                await initMediaPipe();

                // Iniciar loop de processamento
                processFrame();

                document.getElementById('captureBtn').disabled = false;
                updateStatus('Pronto!');
            } catch (err) {
                showError('Erro ao acessar câmera: ' + err.message);
                goToStart();
            }
        }

        async function loadBackgroundImage() {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = 'assets/backgrounds/fundo.jpg';
                img.onload = () => {
                    state.backgroundImage = img;
                    updateStatus('Fundo carregado!');
                    resolve();
                };
                img.onerror = () => {
                    console.warn('Fundo não encontrado, usando cor sólida');
                    state.backgroundImage = null; // Usar cor como fallback
                    resolve();
                };
            });
        }

        async function initMediaPipe() {
            try {
                updateStatus('Carregando MediaPipe...');

                const { FilesetResolver, ImageSegmenter } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js'
                );

                const vision = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
                );

                state.segmenter = await ImageSegmenter.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float32/latest/selfie_segmenter.tflite'
                    },
                    runningMode: 'VIDEO',
                    outputCategoryMask: true,
                    outputConfidenceMasks: false
                });

                updateStatus('MediaPipe OK');
            } catch (err) {
                showError('Erro ao carregar MediaPipe: ' + err.message);
                throw err;
            }
        }

        function processFrame() {
            if (!state.segmenter) return;

            try {
                const timestamp = performance.now();
                const result = state.segmenter.segmentForVideo(state.video, timestamp);

                drawFrame(result);
            } catch (err) {
                console.error('Erro ao processar frame:', err);
            }

            requestAnimationFrame(processFrame);
        }

        function drawFrame(result) {
            const ctx = state.ctx;
            const video = state.video;
            const canvas = state.canvas;

            // Desenhar background
            if (state.backgroundImage) {
                ctx.drawImage(state.backgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                // Fallback: gradiente laranja (Fanta)
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#ff6a00');
                gradient.addColorStop(1, '#ff5a00');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Desenhar pessoa recortada
            if (result.categoryMask) {
                const mask = result.categoryMask.getAsFloat32Array();
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const data = imageData.data;

                // Copiar pixels da câmera
                const videoImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const videoData = videoImageData.data;

                for (let i = 0; i < mask.length; i++) {
                    const isForeground = mask[i] > 0.5;
                    const pixelIndex = i * 4;

                    if (isForeground) {
                        // Copiar pixel da câmera
                        data[pixelIndex] = videoData[pixelIndex];         // R
                        data[pixelIndex + 1] = videoData[pixelIndex + 1]; // G
                        data[pixelIndex + 2] = videoData[pixelIndex + 2]; // B
                        data[pixelIndex + 3] = 255;                       // A
                    } else {
                        // Manter fundo
                        data[pixelIndex + 3] = 0;
                    }
                }

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.putImageData(imageData, 0, 0);
            } else {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        async function capturePhoto() {
            if (state.isProcessing) return;

            state.isProcessing = true;
            document.getElementById('captureBtn').disabled = true;

            try {
                // Contagem regressiva
                for (let i = 3; i > 0; i--) {
                    showScreen('countdownScreen');
                    document.getElementById('countdownNumber').textContent = i;
                    await new Promise(r => setTimeout(r, 1000));
                }

                // Capturar foto
                showScreen('cameraScreen');
                updateStatus('Capturando...');

                await new Promise(r => setTimeout(r, 500));

                state.capturedPhoto = state.canvas.toDataURL('image/jpeg', 0.95);

                // Mostrar resultado
                const resultCanvas = document.getElementById('resultCanvas');
                const img = new Image();
                img.onload = () => {
                    resultCanvas.width = img.width;
                    resultCanvas.height = img.height;
                    resultCanvas.getContext('2d').drawImage(img, 0, 0);
                    showScreen('resultScreen');
                };
                img.src = state.capturedPhoto;
            } catch (err) {
                showError('Erro ao capturar: ' + err.message);
            } finally {
                state.isProcessing = false;
                document.getElementById('captureBtn').disabled = false;
            }
        }

        async function sharePhoto() {
            if (!state.capturedPhoto) return;

            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            try {
                const blob = await (await fetch(state.capturedPhoto)).blob();
                const formData = new FormData();
                formData.append('foto', blob, 'photo.jpg');

                const response = await fetch('https://SEU-DOMINIO/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    const photoUrl = data.url;

                    if (navigator.share) {
                        await navigator.share({
                            title: 'Minha foto no Photobooth Fanta',
                            text: 'Veja minha foto!',
                            url: photoUrl
                        });
                    } else {
                        alert('Link: ' + photoUrl);
                    }
                } else {
                    showError('Erro ao compartilhar');
                }
            } catch (err) {
                showError('Erro: ' + err.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        function goToStart() {
            if (state.video && state.video.srcObject) {
                state.video.srcObject.getTracks().forEach(t => t.stop());
            }
            showScreen('startScreen');
        }
    </script>
</body>
</html>
